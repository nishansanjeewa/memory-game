<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match Game</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    h1 {
        margin-bottom: 10px;
        font-size: 32px;
        color: #333;
    }

    #game {
        display: grid;
        grid-template-columns: repeat(4, 100px);
        grid-gap: 15px;
        margin-bottom: 20px;
    }

    .card {
        width: 100px;
        height: 100px;
        background: white;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
        cursor: pointer;
        border: 2px solid #ddd;
        transition: transform 0.3s;
        transform-style: preserve-3d;
        position: relative;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
        font-size: 40px;
    }

    .front {
        background: #4e73df;
        color: white;
        transform: rotateY(180deg);
    }

    .back {
        background: white;
        border: 2px solid #ddd;
        font-size: 40px;
    }

    #moves {
        margin-bottom: 10px;
        font-size: 20px;
    }

    button {
        padding: 10px 20px;
        background: #4e73df;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #3755c1;
    }

    /* Celebration popup */
    #winMessage {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px 50px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        font-size: 28px;
        text-align: center;
        display: none;
        z-index: 1000;
    }

    /* Confetti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background-color: red;
        top: -10px;
        animation: fall 3s linear forwards;
        z-index: 999;
    }

    @keyframes fall {
        to {
            transform: translateY(120vh) rotate(360deg);
        }
    }
</style>
</head>

<body>

<h1>Memory Match Game</h1>
<div id="moves">Moves: 0</div>

<div id="game"></div>

<button onclick="restartGame()">Restart</button>

<div id="winMessage">🎉 You Win! 🎉</div>

<script>
    const game = document.getElementById("game");
    const movesLabel = document.getElementById("moves");
    const winMessage = document.getElementById("winMessage");

    const emojis = ["🍎","🍌","🍇","🍓","🍒","🍋","🍉","🍑"];
    let cards = [...emojis, ...emojis];

    let firstCard, secondCard;
    let lockBoard = false;
    let moves = 0;
    let matchedCount = 0;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function createBoard() {
        game.innerHTML = "";
        shuffle(cards);
        matchedCount = 0;

        cards.forEach(emoji => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <div class="front">${emoji}</div>
                <div class="back">❓</div>
            `;
            card.addEventListener("click", () => flipCard(card, emoji));
            game.appendChild(card);
        });
    }

    function flipCard(card, emoji) {
        if (lockBoard || card.classList.contains("flipped")) return;

        card.classList.add("flipped");

        if (!firstCard) {
            firstCard = { card, emoji };
        } else {
            secondCard = { card, emoji };
            moves++;
            movesLabel.textContent = "Moves: " + moves;

            lockBoard = true;

            if (firstCard.emoji === secondCard.emoji) {
                matchedCount++;
                resetChoices();

                if (matchedCount === emojis.length) {
                    showCelebration();
                }
            } else {
                setTimeout(() => {
                    firstCard.card.classList.remove("flipped");
                    secondCard.card.classList.remove("flipped");
                    resetChoices();
                }, 700);
            }
        }
    }

    function resetChoices() {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
    }

    function restartGame() {
        moves = 0;
        movesLabel.textContent = "Moves: 0";
        firstCard = null;
        secondCard = null;
        lockBoard = false;
        winMessage.style.display = "none";
        createBoard();
    }
 
    function showCelebration() {
        winMessage.style.display = "block";

        for (let i = 0; i < 120; i++) {
            const confetti = document.createElement("div");
            confetti.classList.add("confetti");

            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.backgroundColor = getRandomColor();
            confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";

            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), 3000);
        }
    }

    function getRandomColor() {
        const colors = ["#ff3838", "#ff9f1a", "#ffdd59", "#32ff7e",
                        "#7efff5", "#18dcff", "#7d5fff", "#ff6b81"];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    createBoard();
</script>

</body>
</html>
