<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Memory Match Game</title>

<style>
    /* Reset and Base Styles */
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f2f2f2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Use min-height to prevent cutoffs on small screens */
    }

    h1 {
        margin-bottom: 10px;
        font-size: clamp(24px, 5vw, 32px); /* Fluid font size */
        color: #333;
        text-align: center;
    }

    #moves {
        margin-bottom: 15px;
        font-size: 20px;
        color: #555;
    }

    /* Responsive Game Grid */
    #game {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 4 Equal columns */
        gap: 15px;
        width: 90%;         /* Take up 90% of mobile screen width */
        max-width: 460px;   /* Stop growing after 460px (Desktop view) */
        margin-bottom: 20px;
    }

    .card {
        background: white;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        border: 2px solid #ddd;
        transition: transform 0.3s;
        transform-style: preserve-3d;
        position: relative;
        
        /* RESPONSIVE MAGIC HERE: */
        width: 100%;          /* Fill the grid cell */
        aspect-ratio: 1 / 1;  /* Force it to be a square */
        -webkit-tap-highlight-color: transparent; /* Remove mobile tap highlight */
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        font-size: 2.5rem; /* Default large size */
        user-select: none; /* Prevent highlighting text on click */
    }

    .front {
        background: #4e73df;
        color: white;
        transform: rotateY(180deg);
    }

    .back {
        background: white;
        color: #333;
    }

    button {
        padding: 12px 24px;
        background: #4e73df;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: background 0.2s;
    }

    button:hover {
        background: #3755c1;
    }

    button:active {
        transform: scale(0.98);
    }

    /* Celebration popup */
    #winMessage {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        width: 90%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        font-size: 24px;
        text-align: center;
        display: none;
        z-index: 1000;
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -10px;
        animation: fall 3s linear forwards;
        z-index: 999;
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 480px) {
        #game {
            gap: 10px; /* Smaller gaps on phone */
        }
        
        .front, .back {
            font-size: 2rem; /* Smaller emojis on phone */
        }

        h1 {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<h1>Memory Match</h1>
<div id="moves">Moves: 0</div>

<div id="game"></div>

<button onclick="restartGame()">Restart Game</button>

<div id="winMessage">
    <h2>🎉 You Win! 🎉</h2>
    <p>Great memory!</p>
    <button onclick="restartGame()">Play Again</button>
</div>

<script>
    const game = document.getElementById("game");
    const movesLabel = document.getElementById("moves");
    const winMessage = document.getElementById("winMessage");

    const emojis = ["🍎","🍌","🍇","🍓","🍒","🍋","🍉","🍑"];
    let cards = [...emojis, ...emojis];

    let firstCard, secondCard;
    let lockBoard = false;
    let moves = 0;
    let matchedCount = 0;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function createBoard() {
        game.innerHTML = "";
        shuffle(cards);
        matchedCount = 0;

        cards.forEach(emoji => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <div class="front">${emoji}</div>
                <div class="back">❓</div>
            `;
            card.addEventListener("click", () => flipCard(card, emoji));
            game.appendChild(card);
        });
    }

    function flipCard(card, emoji) {
        if (lockBoard || card.classList.contains("flipped")) return;

        card.classList.add("flipped");

        if (!firstCard) {
            firstCard = { card, emoji };
        } else {
            secondCard = { card, emoji };
            moves++;
            movesLabel.textContent = "Moves: " + moves;

            lockBoard = true;

            if (firstCard.emoji === secondCard.emoji) {
                matchedCount++;
                resetChoices();

                if (matchedCount === emojis.length) {
                    showCelebration();
                }
            } else {
                setTimeout(() => {
                    firstCard.card.classList.remove("flipped");
                    secondCard.card.classList.remove("flipped");
                    resetChoices();
                }, 700);
            }
        }
    }

    function resetChoices() {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
    }

    function restartGame() {
        moves = 0;
        movesLabel.textContent = "Moves: 0";
        firstCard = null;
        secondCard = null;
        lockBoard = false;
        winMessage.style.display = "none";
        createBoard();
    }
 
    function showCelebration() {
        winMessage.style.display = "block";
        
        // Clean up old confetti if any
        document.querySelectorAll('.confetti').forEach(c => c.remove());

        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement("div");
            confetti.classList.add("confetti");

            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.backgroundColor = getRandomColor();
            confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";

            document.body.appendChild(confetti);

            // Remove confetti element after animation to prevent DOM clutter
            setTimeout(() => confetti.remove(), 4000);
        }
    }

    function getRandomColor() {
        const colors = ["#ff3838", "#ff9f1a", "#ffdd59", "#32ff7e",
                        "#7efff5", "#18dcff", "#7d5fff", "#ff6b81"];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    createBoard();
</script>

</body>
</html>
